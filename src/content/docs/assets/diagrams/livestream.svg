<path d="M204 230 L290 230" style="fill:none;stroke:var(--accent,#087a4d);stroke-width:2;stroke-linejoin:round"/>
<polygon points="290.0,230.0 281.0,234.5 281.0,225.5" style="fill:var(--accent,#087a4d)"/>
<text x="247" y="186" text-anchor="middle" style="font:500 11.5px var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace);fill:var(--accent,#087a4d)">camera,</text>
<text x="247" y="200" text-anchor="middle" style="font:500 11.5px var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace);fill:var(--accent,#087a4d)">mic</text>
