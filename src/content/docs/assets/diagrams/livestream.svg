<text x="513" y="266" text-anchor="middle" style="font:500 11.5px var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace);fill:var(--text,#131715)">chat</text>
<text x="380" y="306" text-anchor="middle" style="font:400 11px var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace);fill:var(--dim,#5c6862)">a viewer token cannot publish media, whatever the client does</text>
</svg>
