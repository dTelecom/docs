<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="A media node sends signed webhook events to the URL from the participant token; your backend verifies them and answers 2xx.">
<rect x="16" y="16" width="268" height="268" rx="14" style="fill:none;stroke:var(--line,#dfe5e2);stroke-width:1.5;stroke-dasharray:5 5"/>
<text x="32" y="38" style="font:500 10.5px var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace);letter-spacing:.09em;fill:var(--dim,#5c6862)">YOUR APP</text>
<rect x="476" y="16" width="268" height="268" rx="14" style="fill:none;stroke:var(--line,#dfe5e2);stroke-width:1.5;stroke-dasharray:5 5"/>
<text x="492" y="38" style="font:500 10.5px var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace);letter-spacing:.09em;fill:var(--dim,#5c6862)">DTELECOM CLOUD</text>
<rect x="40" y="56" width="220" height="68" rx="10" style="fill:var(--panel,#f5f7f6);stroke:var(--line,#dfe5e2);stroke-width:1.5"/>
<text x="56" y="87.0" style="font:600 14px var(--font-body,'Onest','Helvetica Neue',Arial,sans-serif);fill:var(--text,#131715)">Your backend</text>
<text x="56" y="105.0" style="font:400 11px var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace);fill:var(--dim,#5c6862)">createToken({ webhookUrls })</text>
<rect x="40" y="192" width="220" height="68" rx="10" style="fill:var(--panel,#f5f7f6);stroke:var(--line,#dfe5e2);stroke-width:1.5"/>
<text x="56" y="223.0" style="font:600 14px var(--font-body,'Onest','Helvetica Neue',Arial,sans-serif);fill:var(--text,#131715)">Webhook endpoint</text>
<text x="56" y="241.0" style="font:400 11px var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace);fill:var(--dim,#5c6862)">WebhookReceiver</text>
<rect x="500" y="56" width="220" height="68" rx="10" style="fill:var(--panel,#f5f7f6);stroke:var(--line,#dfe5e2);stroke-width:1.5"/>
<text x="516" y="87.0" style="font:600 14px var(--font-body,'Onest','Helvetica Neue',Arial,sans-serif);fill:var(--text,#131715)">Cloud API</text>
<text x="516" y="105.0" style="font:400 11px var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace);fill:var(--dim,#5c6862)">puts the URLs in the token</text>
<rect x="500" y="192" width="220" height="68" rx="10" style="fill:var(--accent-soft,#e2f6ec);stroke:var(--accent,#087a4d);stroke-width:1.5"/>
<text x="516" y="223.0" style="font:600 14px var(--font-body,'Onest','Helvetica Neue',Arial,sans-serif);fill:var(--text,#131715)">Media node</text>
<text x="516" y="241.0" style="font:400 11px var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace);fill:var(--dim,#5c6862)">signs every event</text>
<path d="M260 90 L500 90" style="fill:none;stroke:var(--dim,#5c6862);stroke-width:1.5;stroke-linejoin:round"/>
<polygon points="500.0,90.0 491.0,94.5 491.0,85.5" style="fill:var(--dim,#5c6862)"/>
<circle cx="322" cy="90" r="10" style="fill:var(--bg,#ffffff);stroke:var(--text,#131715);stroke-width:1.5"/>
<text x="322" y="94" text-anchor="middle" style="font:600 11.5px var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace);fill:var(--text,#131715)">1</text>
<text x="400" y="80" text-anchor="middle" style="font:500 11.5px var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace);fill:var(--text,#131715)">createToken()</text>
<path d="M500 212 L260 212" style="fill:none;stroke:var(--accent,#087a4d);stroke-width:2;stroke-linejoin:round"/>
<polygon points="260.0,212.0 269.0,207.5 269.0,216.5" style="fill:var(--accent,#087a4d)"/>
<circle cx="438" cy="212" r="10" style="fill:var(--bg,#ffffff);stroke:var(--text,#131715);stroke-width:1.5"/>
<text x="438" y="216" text-anchor="middle" style="font:600 11.5px var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace);fill:var(--text,#131715)">2</text>
<text x="350" y="202" text-anchor="middle" style="font:500 11.5px var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace);fill:var(--accent,#087a4d)">POST event</text>
<path d="M260 242 L500 242" style="fill:none;stroke:var(--dim,#5c6862);stroke-width:1.5;stroke-linejoin:round;stroke-dasharray:4 4"/>
<polygon points="500.0,242.0 491.0,246.5 491.0,237.5" style="fill:var(--dim,#5c6862)"/>
<circle cx="322" cy="242" r="10" style="fill:var(--bg,#ffffff);stroke:var(--text,#131715);stroke-width:1.5"/>
<text x="322" y="246" text-anchor="middle" style="font:600 11.5px var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace);fill:var(--text,#131715)">3</text>
<text x="400" y="262" text-anchor="middle" style="font:500 11.5px var(--font-mono,'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace);fill:var(--text,#131715)">verify, 2xx</text>
</svg>
